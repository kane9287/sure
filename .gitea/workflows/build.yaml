name: Build and Push
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "tag=$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)" >> "$GITEA_OUTPUT"

      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login my-gitea.nerdsandgeeks.net -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build and push
        run: |
          docker build -t my-gitea.nerdsandgeeks.net/christopher/sure-pnw-financial:${{ steps.version.outputs.tag }} \
                        -t my-gitea.nerdsandgeeks.net/christopher/sure-pnw-financial:latest .
          docker push my-gitea.nerdsandgeeks.net/christopher/sure-pnw-financial:${{ steps.version.outputs.tag }}
          docker push my-gitea.nerdsandgeeks.net/christopher/sure-pnw-financial:latest